set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-features ",*:RGB:hyperlinks:usstyle"
set -g focus-events on

set -g prefix C-f
unbind C-b
bind-key C-f send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

# move current pane into another window (prompts for target window index)
bind g command-prompt -p "join to window:" "join-pane -h -t ':%%'"

# arrange panes into an equal grid (2x2, 3x3, ... depending on count);
# two panes go side by side, since tiled would stack them top/bottom
bind Space if-shell -F '#{==:#{window_panes},2}' \
  'select-layout even-horizontal' \
  'select-layout tiled'

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10
set -g status off

# sesh session picker
bind -N "Switch session" t run-shell "sesh connect \"$(
  sesh list | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^x zoxide ^d tmux kill ^f find' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {})+reload(sesh list)'
)\""

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
